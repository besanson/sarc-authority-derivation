# Ported with attribution from sarc-suite-one-pass's pyproject.toml
# (commit 782261e) -- see ADR-001. This repo has no packaging config of
# its own (it is run in place, not installed) -- this file exists solely
# to hold [tool.mutmut]'s configuration (Phase 2 / release-check mutation
# gate, target participation.py + derive.py, >=0.85) and
# [tool.pytest.ini_options]'s marker registration.

[tool.pytest.ini_options]
markers = [
    "slow: exercises a full-scenario simulation end to end rather than a unit-scoped check -- included in the default `make test` run, but selectable/deselectable via -m 'slow' / -m 'not slow'.",
]

[tool.mutmut]
# Mirrors sarc-suite-one-pass's ADR-002 pattern: source_paths names exactly
# the mutation-testing target files (mutmut's file walk does not respect
# .gitignore, so source_paths = ["."] would blindly copy .git/, out/, and
# the pinned sibling clones). also_copy lists the additional files
# participation.py/derive.py's imports need at test time.
source_paths = ["participation.py", "derive.py"]
only_mutate = ["participation.py", "derive.py"]
also_copy = [
    "grant.py",
    "prereg/",
    "schemas/",
]
pytest_add_cli_args_test_selection = [
    "test_participation.py",
    "test_derive.py",
]
