#
# Ported with attribution from sarc-suite-one-pass's .github/workflows/ci.yml
# (commit 782261e) -- see ADR-001. CI: bootstrap the pinned siblings
# (sarc-suite-one-pass + three engines), verify the imported baseline, then
# run this repo's own full release-check end to end (v0.3, B4: CI must run
# make release-check, not a partial test+formal subset of it).
#
# Hermetic CI (Milestone A2, review-secondary/improvement-plan-9.5-
# 2026-09-06.pdf's reimplemented findings): pandoc and poppler-utils
# (pdftotext/pdfinfo) are installed explicitly below, before bootstrap,
# rather than relied on implicitly from the runner image -- the imported
# baseline's own paper-tex/gates/run_gates.py (exercised by bootstrap.sh's
# "verify imported baseline" step, sarc-suite-one-pass's own
# release-check) invokes both directly via subprocess. No other
# executable the pinned upstream bootstrap invokes needs an apt package:
# its LaTeX toolchain (tectonic) is vendored as a pinned binary download
# by that repo's own bootstrap.sh, not installed via apt.
#
# `package` job (Package A, review-secondary/final-gap-plan-9.5-2026-09-09.pdf's
# own mandatory CI smoke test): deliberately INDEPENDENT of `bootstrap.sh`
# and the pinned siblings -- building and black-box-testing a wheel needs
# neither, and keeping this job free of the (slow) bootstrap phase means
# a packaging regression is caught fast, not only after paying for the
# full `test` job's own ~35-minute release-check. Runs the identical
# `make package-smoke-test` a contributor runs locally, on the same
# Python 3.11/3.12 matrix as `test`, so both are "latest HEAD green" in
# the sense the acceptance criterion means.

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: sarc-authority-derivation

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hermetic CI dependencies (pandoc, poppler-utils)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc poppler-utils

      - name: Bootstrap (pinned siblings + toolchain + imported baseline)
        working-directory: sarc-authority-derivation
        run: bash bootstrap.sh

      - name: make release-check
        working-directory: sarc-authority-derivation
        run: make release-check

  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: sarc-authority-derivation

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build toolchain (python -m build)
        run: pip install -q build

      - name: make package-smoke-test
        working-directory: sarc-authority-derivation
        run: make package-smoke-test
