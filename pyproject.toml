# Ported with attribution from sarc-suite-one-pass's pyproject.toml
# (commit 782261e) -- see ADR-001. Originally held no packaging config of
# its own (run in place, not installed) -- [project]/[project.scripts]
# below (Milestone E1, prereg/v6.1-authoritybench-amendment.md's own
# "authority_compiler's fuller API" section: "pyproject exposes... an
# authority-bench command") is the first packaging section this file
# gains, minimal on purpose: it does not change how anything else in this
# repo is run (`python3 <script>.py` keeps working unchanged for every
# other entry point; nothing here is installed as part of `make
# bootstrap`/`make release-check`). The rest of this file still holds
# [tool.mutmut]'s configuration (Phase 2 / release-check mutation gate,
# target participation.py + derive.py + reduct.py + domain_v4.py +
# losses_v4.py + discernibility.py + synthesis.py + src/authority_
# compiler/api.py, >=0.85, a hard gate as of v0.3, extended v0.4/
# Milestone C, Milestone D, and Milestone E1 -- see `make mutate`/
# `mutation_check.py`) and [tool.pytest.ini_options]'s marker
# registration.
#
# Package A (review-secondary/final-gap-plan-9.5-2026-09-09.pdf's own
# P0): until this amendment, [tool.setuptools] named only `authority_
# bench` (py-modules) -- pytest could still import `authority_compiler`
# because [tool.pytest.ini_options]'s own `pythonpath = ["src"]` injects
# it into the TEST path, but a wheel built from this file never
# contained `src/authority_compiler` at all, and even `authority_bench`
# itself was not truly installable standalone: BOTH modules' own real
# dependency closure (traced by direct import inspection, not assumed)
# reaches seven more top-level single-file modules --
# reduct/synthesis/participation/discernibility/losses/domain/mining_
# baseline -- none of which were previously declared either. `packages`/
# `package-dir` below add ONLY `authority_compiler` as a real package
# (mapped to its actual `src/` location); `py-modules` grows to name
# every module in that traced closure, so a wheel built from this file
# now contains everything both `import authority_compiler` and `import
# authority_bench` actually need, standalone, with no repository root,
# pytest pythonpath, editable install, or sibling directory required --
# verified directly (see A3's own CI job), not merely declared.

[project]
name = "sarc-authority-derivation"
version = "0.6.1"
description = "Deriving Authority: a machine-checkable derivation from a declared loss model to the core attribute set a pre-action authority gate must observe."
requires-python = ">=3.11"
# Runtime dependencies of the traced closure below (bootstrap.sh installs
# both, unpinned, the same convention kept here rather than inventing a
# new one): pyyaml (domain.py's own loaders) and python-sat (synthesis.py's
# SAT/MaxSAT backends).
dependencies = [
    "pyyaml",
    "python-sat",
]

[project.scripts]
authority-bench = "authority_bench:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `authority_bench` plus its full traced import closure (module docstring
# comment above): reduct -> participation -> domain/losses; synthesis ->
# discernibility/reduct; authority_bench itself -> mining_baseline/reduct.
# Every name here is a real top-level module this repo already runs via
# `python3 <name>.py` / `make <target>` unchanged -- none is moved,
# duplicated, or renamed by this packaging declaration.
py-modules = [
    "authority_bench",
    "reduct",
    "synthesis",
    "participation",
    "discernibility",
    "losses",
    "domain",
    "mining_baseline",
]
# `authority_compiler` is the one real src-layout PACKAGE (a directory,
# not a single file) -- mapped explicitly to its actual location rather
# than a blanket `package-dir = {"" = "src"}`, because that blanket form
# would also redirect the py-modules above (which stay at the repo root)
# to look under src/, breaking them. An explicit, one-entry mapping says
# exactly what it does and nothing more.
packages = ["authority_compiler"]

[tool.setuptools.package-dir]
authority_compiler = "src/authority_compiler"

[tool.pytest.ini_options]
# pythonpath = ["src"]: Milestone E1's src/authority_compiler is imported
# as `authority_compiler` (no `src.` prefix) -- mutmut's own configuration.py
# treats a top-level `src/` directory as a source root to import THROUGH,
# not a real dotted package component (`src.authority_compiler` trips its
# trampoline instrumentation: "Module name starts with `src.`, which is
# invalid"), so `src/` deliberately carries no `__init__.py` of its own.
pythonpath = ["src"]
# norecursedirs adds "mutants" to pytest's own defaults (pytest replaces
# the whole default list once this key is set at all, so the stock
# entries are repeated here rather than only appended to): `make mutate`
# leaves mutants/ (mutmut's own working copy, including a full copy of
# every test_*.py, intentionally left on disk between runs for mutmut's
# own incremental caching -- see `make clean`'s paired `rm -rf mutants
# .mutmut-cache`) sitting at the repo root. A bare `pytest -v` with no
# path argument (`make test`/release-check's own first step) recurses
# into it and collects those copies too; since neither copy carries an
# `__init__.py`, pytest's rootless import model requires every collected
# test file to have a globally unique basename, and mutants/test_*.py
# collides with test_*.py at the repo root ("import file mismatch").
# This is a pure test-collection hygiene fix, unrelated to mutmut's own
# directory/caching semantics, which are untouched.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "mutants"]
markers = [
    "slow: exercises a full-scenario simulation end to end rather than a unit-scoped check -- included in the default `make test` run, but selectable/deselectable via -m 'slow' / -m 'not slow'.",
]

[tool.mutmut]
# Mirrors sarc-suite-one-pass's ADR-002 pattern: source_paths names exactly
# the mutation-testing target files (mutmut's file walk does not respect
# .gitignore, so source_paths = ["."] would blindly copy .git/, out/, and
# the pinned sibling clones). also_copy lists the additional files these
# targets' imports need at test time (third-party packages like PySAT
# are installed globally, via bootstrap.sh, not copied). reduct.py added
# v0.3 (prereg/v3-core-reduct-correction.md); domain_v4.py/losses_v4.py
# added v0.4/Milestone C (prereg/v4-realistic-domain.md, tag
# prereg-p5-v4); discernibility.py/synthesis.py added Milestone D
# (prereg/v5-synthesis.md, tag prereg-p5-v5); src/authority_compiler/
# api.py added Milestone E1 (packages participation.py/reduct.py/
# synthesis.py behind one call, no new derivation semantics --
# prereg/v6-authority-bench.md, tag prereg-p5-v6); domain_datacomms.py/
# losses_datacomms.py added Milestone E Step 2 (the independently-built
# data-and-communications domain, prereg/v6.1-authoritybench-
# amendment.md, tag prereg-p5-v6.1); costs_v7.py added Package C
# (prereg/v7-cost-sensitive-contracts.md, tag prereg-p5-v7: CH-B2's own
# registered cost formula and per-property values -- the one piece of
# Package C with genuine correctness semantics; checkers/ch_b2_check.py
# itself is the verification layer, not mutated, exactly how every
# other CH-checker is already excluded here) -- ADR-003 is being
# extended, not superseded, by any of these additions.
source_paths = ["participation.py", "derive.py", "reduct.py", "domain_v4.py", "losses_v4.py", "discernibility.py", "synthesis.py", "src/authority_compiler/api.py", "domain_datacomms.py", "losses_datacomms.py", "costs_v7.py"]
only_mutate = ["participation.py", "derive.py", "reduct.py", "domain_v4.py", "losses_v4.py", "discernibility.py", "synthesis.py", "src/authority_compiler/api.py", "domain_datacomms.py", "losses_datacomms.py", "costs_v7.py"]
also_copy = [
    "domain.py",
    "losses.py",
    "grant.py",
    "schemas_check.py",
    "prereg/",
    "schemas/",
    "src/authority_compiler/__init__.py",
]
pytest_add_cli_args_test_selection = [
    "test_participation.py",
    "test_derive.py",
    "test_reduct.py",
    "test_domain_v4.py",
    "test_losses_v4.py",
    "test_discernibility.py",
    "test_synthesis.py",
    "test_authority_compiler.py",
    "test_domain_datacomms.py",
    "test_losses_datacomms.py",
    "test_costs_v7.py",
]
