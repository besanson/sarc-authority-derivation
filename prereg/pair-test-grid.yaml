# Task brief Phase 1 (V1, prereg-p5-v1): the property enumeration and
# variation domains for the exhaustive finite model that
# checkers/participation_check.py and checkers/pairtest_check.py both
# sweep (CH-A2's exhaustive-equality decision rule requires both to run
# over exactly this same declared grid, independently implemented).
#
# CORRECTION (ADR-002-participation-tuple-design.md), made before any
# Phase 3 experiment or CH-A1-CH-A4 result existed: the original version
# of this file (still visible at the prereg-p5-v1 tag, left as an honest
# historical record rather than rewritten, per REPLICATIONS.md's own
# no-silent-rewrite principle) declared a twelfth-row "context" group
# (role_entitlement_ceiling, role_window, role_allowed_classes) as
# separately observable candidate properties. Running derive.py during
# Phase 2 development surfaced a real problem: because each was a pure,
# deterministic function of actor_role, no reachable pair could ever vary
# one while holding actor_role fixed, so all four (actor_role included)
# were derived as non-participating -- correct under that tuple design,
# but describing a gate that could not actually evaluate the entitlement
# checks, since it would observe neither the role nor the resolved
# threshold. Per-role policy is now background configuration the
# predicates consult directly (domain.role_policy(), losses.py) rather
# than a separate observable field -- see the ADR for the full account.
# Nine candidate properties remain, one row each.
#
# Value counts are small by design -- this is the finite model the
# brief's checkers must be able to enumerate EXHAUSTIVELY, not a sample
# -- but every value is chosen to be discriminating (see rationale)
# rather than padding. The realized grid size after reachability
# filtering is a number derive.py/the checkers generate and report,
# never typed here.

properties:
  action:
    actor_role:
      domain: [agent-replenish, agent-w2-replenish, agent-delegate, agent-unauthorized]
      rationale: >-
        All four declared roles (loss-model.yaml); both fully-authorized
        per-workflow labels included so the derivation is checked not to
        treat them differently by name alone.
    resource_class:
      domain: [consumables, durable-goods, capital-equipment]
      rationale: All three declared resource classes.
    order_value:
      domain: [600.0, 1200.0, 2500.0]
      rationale: >-
        Below both entitlement ceilings (600); between agent-delegate's
        800 and the full 2000 ceiling (1200); above both (2500) --
        discriminates order_value_beyond_entitlement across every role's
        own ceiling.
    day:
      domain: [50, 140, 300]
      rationale: >-
        50 and 300 fall outside agent-delegate's declared [100, 180]
        window but inside every unrestricted role's [0, 999]; 140 falls
        inside both -- discriminates procurement_outside_temporal_window
        without needing a day per role.
    workflow:
      domain: [W1, W2]
      rationale: >-
        Included as a known-negative control: no loss predicate reads
        workflow directly, so the derivation is expected to place it in
        the coverage list (Definition 3) -- a check on the procedure's
        own correctness, not just its positive findings.

  evidence:
    grant_id:
      domain: [null, "g-fresh", "g-consumed"]
      rationale: >-
        No grant presented; a grant not in any reachable
        consumed_grant_ids value; a grant that IS in the
        consumed_grant_ids domain's nonempty value -- the minimal set
        that can discriminate replayed_consumed_grant.

  control_state:
    consumed_grant_ids:
      domain: [[], ["g-consumed"]]
      rationale: Empty ledger; ledger containing exactly "g-consumed".
    budget_remaining:
      domain: [0.0, 1000.0, 5000.0]
      rationale: >-
        Fully depleted (0); partial (1000, below the 1200/2500
        order_value points, above 600); ample (5000, above all three).
    frozen:
      domain: [false, true]
      rationale: Direct boolean; no further discrimination needed.

reachability:
  # Definition 1 (participation.py) restricts pairwise comparisons to
  # REACHABLE tuples only -- not every combination of the domains above.
  post_remediation: >-
    A tuple is remediation-reachable if it differs from a rank-0
    reachable tuple ONLY in action.order_value, and that order_value
    change is producible by one of the imported baseline's two
    remediation operators (composition.py, sarc-suite-one-pass): evidence
    substitution can move order_value to ANY other value in the domain
    (corrected evidence can be higher or lower than corrupted evidence --
    see suite_sim.py's stale_master_data, which corrupts downward, versus
    plausible_outlier, which corrupts upward); resource downroute
    (W2 only) can move order_value only to a strictly LOWER value in the
    domain's own ordering (600 < 1200 < 2500), never higher, since it
    only ever scales a proposed quantity down. The executable-reachable
    set (Definition 1) is the union of rank-0 (every combination of the
    domains above -- no cross-field filter needed now that policy is not
    a separate field) and remediation-reachable tuples -- this is what
    makes reachability depend on the remediation-coupled setting rather
    than being a static action space.

# v2 registration (prereg/v2-reachability-redesign.md, tag prereg-p5-v2).
# Machine-readable declaration only -- no v2 code reads this section yet;
# domain.py's CANDIDATE_PROPERTIES, property_domains(), and the checkers
# are all unchanged and continue to read only the v1 "properties" and
# "reachability" keys above. This "v2" key is a sibling those functions
# never look at, so v1's release-check, formal double-run, and test suite
# are unaffected by its presence -- verified directly (make release-check)
# after this section was added, not assumed.
v2:
  properties:
    action:
      min_order_quantity:
        domain: [500.0, 900.0, 2000.0]
        rationale: >-
          A declared per-decision supplier minimum order quantity,
          checked against order_value's existing three-point domain
          (600.0, 1200.0, 2500.0) before this file was written:
          500.0 excludes nothing from rank-0 (a safety-valve value with
          no below-threshold case, included for variety); 900.0
          excludes order_value=600.0 from rank-0 (downroute-only
          reachable); 2000.0 excludes order_value in {600.0, 1200.0}
          from rank-0 (both downroute-only reachable). Every value
          therefore has at least one rank-0-valid order_value pairing,
          and two of the three produce genuine downroute-only
          reachable combinations.

  reachability:
    rank0_constraint_v2: >-
      Declared assumption, v2 only: order_value >= min_order_quantity
      always holds at rank-0 -- a well-formed, demand-driven initial
      proposal never falls below the supplier's own declared minimum.
      A tuple with order_value < min_order_quantity is therefore NOT
      rank-0 reachable under v2; it is reachable only per
      downroute_only_reachable below.
    downroute_only_reachable: >-
      Grounded directly in composition._maybe_downroute
      (sarc-suite-one-pass, pinned, read before this section was
      written): feasible_qty = max(0, min(proposed_qty, max_qty_by_cost,
      max_qty_by_carbon)) -- a pure budget-fitting calculation with no
      minimum-order-quantity term anywhere in it, W2 only, strictly
      decreasing when it fires. Characterized here as: from any rank-0
      tuple with workflow == "W2" (rank0_constraint_v2 guarantees
      order_value >= min_order_quantity for every such tuple), the
      tuple with order_value moved to any strictly lower point in its
      declared domain is downroute-only reachable -- including points
      that now violate order_value >= min_order_quantity, since the
      real mechanism this characterizes has no min_order_quantity term
      to respect that boundary. Unlike v1's evidence-substitution
      characterization, this image is NOT a subset of rank-0 (v2's own
      rank0_constraint_v2 declares the below-threshold combinations
      unreachable at rank-0 by construction), so Proposition 0-general's
      Corollary 1 (prereg/v2-reachability-redesign.md) does not apply to
      it the way it provably does to evidence substitution.
